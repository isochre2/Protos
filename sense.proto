syntax = "proto3";

option csharp_namespace = "Protos";

package sense;

// The greeting service definition.
service Sensor {
  // Sends a greeting
  rpc GetLinePower (PowerSensingRequest) returns (PowerSensingReply);
  rpc GetEnergyStats (EnergyStatsRequest) returns (EnergyStatsReply);
  rpc GetVibrationData (VibrationDataRequest) returns (VibrationDataReply);
  rpc GetRotationSpeed (RotationSpeedRequest) returns (RotationSpeedReply);
  rpc GetVibrationSpectrum (VibrationSpectrumRequest) returns (VibrationSpectrumReply);
  rpc SetVibrationReference (SetVibrationReferenceRequest) returns (SetVibrationReferenceReply);
  rpc GetSimulatedSpeed (SimulatedSpeedRequest) returns (SimulatedSpeed);
  rpc SetSimulatedSpeed (SimulatedSpeed) returns (SimulatedSpeed);
  rpc ResetConfig (ResetConfigRequest) returns (ResetConfigReply);
}

// The request message containing the user's name.
message PowerSensingRequest {
  string line = 1;
}

// The response message containing the greetings.
message PowerSensingReply {
  double power = 1;
  double voltage = 2;
  double current = 3;
}

// The request message containing the user's name.
message EnergyStatsRequest {
  //string line = 1;
}

// The response message containing the greetings.
message EnergyStatsReply {
  double totalLastHourEnergy = 1;
  double totalLastMonthEnergy = 2;
  double totalEnergyEver = 3;
}

message VibrationDataRequest{}

message VibrationDataReply
{
	repeated double VibrationValues = 1;
}

message RotationSpeedRequest{}

message RotationSpeedReply{
	double rotationSpeedRPM = 1;
}

message VibrationSpectrumRequest {}

message VibrationSpectrumReply {
  bool available = 1;                    // faux tant qu'aucune capture n'a réussi
  int64 timestampUnixMs = 2;             // heure de la capture
  double rotationSpeedRPM = 3;           // 0 si inconnue
  double frequencyStepHz = 4;            // écart en Hz entre deux points
  repeated double amplitudeX = 5;        // m/s², de 0 à 400 Hz
  repeated double amplitudeY = 6;
  repeated double amplitudeZ = 7;
  repeated FrequencyMarker markers = 8;  // repères calculés à partir de la vitesse
  ComparisonStatus status = 9;
  int32 progress = 10;                   // captures déjà prises (référence ou moyenne)
  int32 progressTotal = 11;              // captures nécessaires : 10 pour la référence, 5 pour la moyenne
  int64 referenceTimestampUnixMs = 12;   // date de la référence (0 si aucune)
  repeated double referenceX = 13;       // référence ramenée à la vitesse actuelle, même pas que amplitudeX
  repeated double referenceY = 14;
  repeated double referenceZ = 15;
  repeated Anomaly anomalies = 16;       // nouvelles fréquences (vide sauf si ANOMALY)
}

// Bouton « Définir comme référence » : lance la moyenne des 10 captures suivantes
message SetVibrationReferenceRequest {}
message SetVibrationReferenceReply {}

// Où en est la comparaison avec la référence
enum ComparisonStatus {
  NO_REFERENCE = 0;          // aucune référence enregistrée
  RECORDING_REFERENCE = 1;   // enregistrement en cours (progress / progressTotal)
  SPEED_INCOMPATIBLE = 2;    // vitesse inconnue ou à plus de 5 % de celle de la référence
  COLLECTING = 3;            // vitesse compatible, moyenne des captures en cours (progress / progressTotal)
  NORMAL = 4;                // comparaison faite : aucune nouvelle fréquence
  ANOMALY = 5;               // comparaison faite : au moins une nouvelle fréquence
}

message Anomaly {
  double frequencyHz = 1;
  string label = 2;                      // texte de l'info-bulle, ex. « 205 Hz ≈ passage rouleaux »
}

message FrequencyMarker {
  string label = 1;
  double frequencyHz = 2;
  bool approximate = 3;                  // vrai pour les repères de la butée
}

// Vitesse de rotation simulée, pour tester sans le moulin (réglée depuis la page Maintenance)
message SimulatedSpeedRequest {}
message SimulatedSpeed {
  bool enabled = 1;               // vrai : la vitesse simulée remplace celle du KY003
  double rotationSpeedRPM = 2;    // vitesse simulée, en tr/min
}

// Bouton « Réinitialiser la configuration » : la configuration en service est remplacée par celle
// par défaut (fichier versionné dans le dépôt PowerMonitorApp)
message ResetConfigRequest {}
message ResetConfigReply {}
